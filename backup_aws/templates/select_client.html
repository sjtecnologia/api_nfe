<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4>Selecionar Cliente</h4>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            {% for cliente in clientes %}
                            <div class="col-md-6 mb-3">
                                <div class="card">
                                    <div class="card-body">
                                        <h5>{{ cliente.razao_social }}</h5>
                                        {% if cliente.nome_fantasia %}
                                        <p class="text-muted">{{ cliente.nome_fantasia }}</p>
                                        {% endif %}
                                        <a href="{{ url_for('home.select_client', cliente_id=cliente.cliente_id) }}" 
                                           class="btn btn-primary">
                                            Acessar
                                        </a>
                                    </div>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
