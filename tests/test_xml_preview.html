            display: none;

        .loading-spinner {
            border: 6px solid #f3f3f3;

            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;

            0% { transform: rotate(0deg); }
