{% extends 'base.html' %}

{% block title %}Categorias do Fluxo de Caixa{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="fas fa-tags me-2"></i>Categorias do Fluxo de Caixa</h2>
        <a class="btn btn-outline-primary" href="{{ url_for('admin.fluxo_caixa_dashboard') }}">
            <i class="fas fa-arrow-left me-1"></i>Voltar ao Fluxo de Caixa
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-header"><h5 class="mb-0">Nova Categoria</h5></div>
        <div class="card-body">
            <form id="formCategoria" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Nome</label>
                    <input id="nomeCategoria" name="nome" type="text" class="form-control" maxlength="100" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Tipo</label>
                    <select id="tipoCategoria" name="tipo_lancamento" class="form-select" required>
                        <option value="DESPESA" selected>Despesa</option>
                        <option value="RECEITA">Receita</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Descrição (opcional)</label>
                    <input id="descricaoCategoria" name="descricao" type="text" class="form-control" maxlength="255">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-save me-1"></i>Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><h5 class="mb-0">Categorias Cadastradas</h5></div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Descrição</th>
                        <th>Cadastro</th>
                    </tr>
                </thead>
                <tbody id="tbodyCategorias">
                    <tr><td colspan="4" class="text-center text-muted py-3">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
    const formCategoriaEl = document.getElementById('formCategoria');

    const formatDateBr = (isoDate) => {
        if (!isoDate || typeof isoDate !== 'string') return '-';
        const m = isoDate.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m) return isoDate;
        return `${m[3]}/${m[2]}/${m[1]}`;
    };

    function initEnterNavigationFormCategoria() {
        if (!formCategoriaEl) return;

        const getOrderedFields = () => {
            const fields = [
                formCategoriaEl.querySelector('[name="nome"]'),
                formCategoriaEl.querySelector('[name="tipo_lancamento"]'),
                formCategoriaEl.querySelector('[name="descricao"]'),
                formCategoriaEl.querySelector('button[type="submit"]'),
            ];

            return fields.filter((el) => el && !el.disabled && el.type !== 'hidden');
        };

        formCategoriaEl.addEventListener('keydown', (ev) => {
            if (ev.key !== 'Enter' || ev.shiftKey) return;

            const tagName = (ev.target?.tagName || '').toLowerCase();
            if (tagName === 'textarea') return;

            const fields = getOrderedFields();
            const currentIndex = fields.indexOf(ev.target);
            if (currentIndex === -1) return;

            ev.preventDefault();

            const nextField = fields[currentIndex + 1];
            if (nextField) {
                nextField.focus();
                if (nextField.tagName && nextField.tagName.toLowerCase() === 'input') {
                    nextField.select?.();
                }
                return;
            }

            formCategoriaEl.requestSubmit();
        });
    }

    async function carregarCategorias() {
        const res = await fetch(`/admin/api/fluxo-caixa/categorias?_ts=${Date.now()}`, {
            cache: 'no-store',
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error || 'Erro ao carregar categorias');

        const rows = json.data || [];
        const tbody = document.getElementById('tbodyCategorias');
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">Nenhuma categoria cadastrada</td></tr>';
            return;
        }

        tbody.innerHTML = rows.map((r) => `
            <tr>
                <td>${r.nome}</td>
                <td><span class="badge ${r.tipo_lancamento === 'RECEITA' ? 'bg-success' : 'bg-danger'}">${r.tipo_lancamento || '-'}</span></td>
                <td>${r.descricao || '-'}</td>
                <td>${formatDateBr(r.created_at)}</td>
            </tr>
        `).join('');
    }

    document.getElementById('formCategoria').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const form = ev.currentTarget;
        const submitButton = form.querySelector('button[type="submit"]');
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        try {
            await (window.ButtonLoading?.run
                ? window.ButtonLoading.run(submitButton, 'Salvando...', async () => {
                    const res = await fetch('/admin/api/fluxo-caixa/categorias', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload),
                    });
                    const json = await res.json();
                    if (!res.ok || !json.success) {
                        throw new Error(json.error || 'Erro ao salvar categoria');
                    }
                })
                : (async () => {
                    const res = await fetch('/admin/api/fluxo-caixa/categorias', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload),
                    });
                    const json = await res.json();
                    if (!res.ok || !json.success) {
                        throw new Error(json.error || 'Erro ao salvar categoria');
                    }
                })());

            form.reset();
            await carregarCategorias();
        } catch (err) {
            alert(err.message || 'Falha ao salvar categoria');
        }
    });

    initEnterNavigationFormCategoria();
    carregarCategorias().catch((err) => alert(err.message || 'Falha ao carregar categorias'));
})();
</script>
{% endblock %}
