{% extends "base.html" %}

{% block title %}Recuperar Senha - EmiteMax{% endblock %}

{% block content %}
<div class="container-fluid auth-shell">
    <div class="row justify-content-center align-items-center auth-row">
        <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-12">
            
            <!-- Card de Recuperação de Senha -->
            <div class="card shadow-lg border-0 auth-card">
                
                <!-- Header -->
                <div class="card-header text-center py-4 auth-card-header" style="border: none;">
                    <div class="logo-container mb-3">
                        <img src="{{ url_for('static', filename='img/emitemax-logo.png') }}" 
                             alt="EmiteMax" 
                             style="width: 120px; height: auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                    </div>
                    <h2 class="text-white mb-1" style="font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                        <i class="fas fa-key me-2"></i>Recuperar Senha
                    </h2>
                    <p class="text-white mb-0" style="opacity: 0.9; font-size: 0.95rem;">
                        Informe seu email para receber o link de recuperação
                    </p>
                </div>
                
                <!-- Corpo do Formulário -->
                <div class="card-body p-5 auth-card-body">
                    
                    <form method="POST" id="forgotPasswordForm">
                        
                        <!-- Campo Email -->
                        <div class="form-group mb-4">
                            <label for="email" class="form-label text-dark font-weight-600">
                                <i class="fas fa-envelope text-primary me-2"></i>
                                Email
                            </label>
                            <input type="email" class="form-control form-control-lg auth-input" id="email" name="email" 
                                   placeholder="seu@email.com" required>
                            <small class="form-text text-muted mt-2">
                                <i class="fas fa-info-circle"></i>
                                Enviaremos um link de recuperação para este email.
                            </small>
                        </div>
                        
                        <!-- Botão de Submit -->
                        <div class="form-group mb-4 d-grid">
                            <button type="submit" class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center auth-submit-btn">
                                <span class="btn-text">
                                    <i class="fas fa-paper-plane me-2"></i>Enviar Link
                                </span>
                                <i class="fas fa-spinner fa-spin d-none" id="loading-spinner"></i>
                            </button>
                        </div>
                        
                        <!-- Link para Voltar -->
                        <div class="text-center">
                            <a href="{{ url_for('auth.login') }}" class="text-muted" style="font-size: 0.9rem; text-decoration: none;">
                                <i class="fas fa-arrow-left"></i>
                                Voltar ao login
                            </a>
                        </div>
                        
                    </form>
                </div>
                
                <!-- Footer -->
                <div class="card-footer text-center py-3 auth-card-footer" style="border: none;">
                    <p class="text-muted mb-0" style="font-size: 0.85rem;">
                        <i class="fas fa-shield-alt text-primary"></i>
                        Sistema Seguro EmiteMax &copy; 2025
                    </p>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
    const btn = this.querySelector('button[type="submit"]');
    const btnText = btn.querySelector('.btn-text');
    const spinner = btn.querySelector('#loading-spinner');
    
    btnText.classList.add('d-none');
    spinner.classList.remove('d-none');
    btn.disabled = true;
});
</script>

<style>
.auth-shell {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(34, 162, 201, 0.20), transparent 30%),
        radial-gradient(circle at bottom right, rgba(15, 76, 129, 0.18), transparent 28%),
        linear-gradient(135deg, #eef4f8 0%, #d9e7f2 48%, #edf3f8 100%);
}

.auth-row {
    min-height: 100vh;
    padding: 32px 0;
}

.auth-card {
    border-radius: 24px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
    animation: authRise 0.6s ease-out;
}

.auth-card-header {
    background: linear-gradient(135deg, #0f4c81 0%, #0b6aa8 56%, #22a2c9 100%);
}

.auth-card-body {
    padding: 2.5rem !important;
}

.auth-card-footer {
    background: linear-gradient(180deg, #f8fbfd 0%, #ffffff 100%);
}

.auth-input {
    border-radius: 14px;
    border: 2px solid #d9e2ec;
    padding: 16px 18px;
    font-size: 1rem;
    transition: all 0.25s ease;
}

.auth-input:focus {
    border-color: #22a2c9;
    box-shadow: 0 0 0 0.2rem rgba(34, 162, 201, 0.20);
    transform: translateY(-1px);
}

.auth-submit-btn {
    border-radius: 14px;
    min-height: 60px;
    padding: 16px 22px;
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    box-shadow: 0 8px 24px rgba(34, 162, 201, 0.28);
    transition: all 0.25s ease;
}

.auth-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(34, 162, 201, 0.36);
}

@keyframes authRise {
    from {
        opacity: 0;
        transform: translateY(24px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    .auth-row {
        padding: 20px 0;
    }

    .auth-card-body {
        padding: 2rem !important;
    }
}

@media (max-width: 576px) {
    .auth-row {
        padding: 12px 0;
    }

    .auth-card {
        border-radius: 18px;
    }

    .auth-card-body {
        padding: 1.5rem !important;
    }

    .auth-submit-btn {
        min-height: 56px;
        font-size: 1rem;
    }
}
</style>
{% endblock %}
