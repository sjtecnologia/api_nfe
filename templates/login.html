{% extends "base.html" %}

{% block title %}Login - EmiteMax{% endblock %}

{% block content %}
<div class="container-fluid auth-shell">
    <div class="row justify-content-center align-items-center auth-row">
        <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-12">
            
            
            
            <!-- Card de Login Principal -->
            <div class="card shadow-lg border-0 auth-card">
                
                <!-- Header -->
                <div class="card-header text-center py-4 auth-card-header" style="border: none;">
                    <div class="logo-container mb-3">
                        <img src="{{ url_for('static', filename='img/emitemax-logo.png') }}" 
                             alt="EmiteMax" 
                             style="width: 120px; height: auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                    </div>
                    <h2 class="text-white mb-1" style="font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                        EmiteMax
                    </h2>
                    <p class="text-white mb-0" style="opacity: 0.9; font-size: 0.95rem;">
                        Sistema de Emissão de Notas Fiscais
                    </p>
                    <small class="text-white" style="opacity: 0.7;">
                        v2.0
                    </small>
                </div>
                
                <!-- Corpo do Formulário -->
                <div class="card-body p-5 auth-card-body">
                    
                    <form method="POST" id="loginForm">
                        
                        <!-- Campo Email -->
                        <div class="form-group mb-4">
                            <label for="username" class="form-label text-dark font-weight-600">
                                <i class="fas fa-envelope text-primary me-2"></i>
                                Email
                            </label>
                            <input type="email" class="form-control form-control-lg auth-input" id="username" name="username" 
                                   placeholder="seu@email.com" required>
                        </div>
                        
                        <!-- Campo Password -->
                        <div class="form-group mb-4">
                            <label for="password" class="form-label text-dark font-weight-600">
                                <i class="fas fa-lock text-primary me-2"></i>
                                Senha
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-lg auth-input auth-input-group-left" id="passwordField" name="password"
                                       placeholder="Digite sua senha" required>
                                <div class="input-group-append">
                                    <button class="btn btn-outline-secondary auth-input-group-right" type="button" id="togglePassword">
                                        <i class="fas fa-eye" id="toggleIcon"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Checkbox Remember Me -->
                        <div class="form-group mb-4">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="remember_me" name="remember_me">
                                <label class="custom-control-label" for="remember_me">
                                    <span class="text-muted">Lembrar de mim por 30 dias</span>
                                </label>
                            </div>
                        </div>
                        
                        <!-- Botão de Submit -->
                        <div class="form-group mb-4 d-grid">
                            <button type="submit" class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center auth-submit-btn">
                                <span class="btn-text">
                                    <i class="fas fa-sign-in-alt me-2"></i>Entrar
                                </span>
                                <i class="fas fa-spinner fa-spin d-none" id="loading-spinner"></i>
                            </button>
                        </div>
                        
                        <!-- Links Adicionais -->
                        <div class="text-center">
                            <a href="{{ url_for('auth.forgot_password') }}" class="text-muted" style="font-size: 0.9rem; text-decoration: none;">
                                <i class="fas fa-question-circle"></i>
                                Esqueceu sua senha?
                            </a>
                        </div>
                        
                    </form>
                </div>
                
                <!-- Footer -->
                <div class="card-footer text-center py-3 auth-card-footer" style="border: none;">
                    <p class="text-muted mb-0" style="font-size: 0.85rem;">
                        <i class="fas fa-shield-alt text-primary"></i>
                        Sistema Seguro EmiteMax &copy; 2025
                    </p>
                </div>
            </div>
            

            
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.auth-shell {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(34, 162, 201, 0.20), transparent 30%),
        radial-gradient(circle at bottom right, rgba(15, 76, 129, 0.18), transparent 28%),
        linear-gradient(135deg, #eef4f8 0%, #d9e7f2 48%, #edf3f8 100%);
}

.auth-row {
    min-height: 100vh;
    padding: 32px 0;
}

.auth-card {
    border-radius: 24px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
    animation: authRise 0.6s ease-out;
}

.auth-card-header {
    background: linear-gradient(135deg, #0f4c81 0%, #0b6aa8 56%, #22a2c9 100%);
}

.auth-card-body {
    padding: 2.5rem !important;
}

.auth-card-footer {
    background: linear-gradient(180deg, #f8fbfd 0%, #ffffff 100%);
}

.auth-input {
    border-radius: 14px;
    border: 2px solid #d9e2ec;
    padding: 16px 18px;
    font-size: 1rem;
    transition: all 0.25s ease;
}

.auth-input:focus {
    border-color: #22a2c9;
    box-shadow: 0 0 0 0.2rem rgba(34, 162, 201, 0.20);
    transform: translateY(-1px);
}

.auth-input-group-left {
    border-radius: 14px 0 0 14px !important;
    border-right: none !important;
}

.auth-input-group-right {
    border-radius: 0 14px 14px 0 !important;
    border: 2px solid #d9e2ec;
    border-left: none;
    padding: 0 18px;
    transition: all 0.25s ease;
}

.auth-input-group-right:hover {
    background-color: #eef4f8;
    border-color: #22a2c9;
    color: #22a2c9;
}

.auth-submit-btn {
    border-radius: 14px;
    min-height: 60px;
    padding: 16px 22px;
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    box-shadow: 0 8px 24px rgba(34, 162, 201, 0.28);
    transition: all 0.25s ease;
}

.auth-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(34, 162, 201, 0.36);
}

.btn-loading .btn-text {
    opacity: 0.3;
}

.btn-loading #loading-spinner {
    display: inline-block !important;
}

@keyframes authRise {
    from {
        opacity: 0;
        transform: translateY(24px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(100px); }
}

@media (max-width: 768px) {
    .auth-row {
        padding: 20px 0;
    }
    .auth-card-body {
        padding: 2rem !important;
    }
    .alerts-container {
        position: fixed !important;
        top: 10px !important;
        left: 10px !important;
        right: 10px !important;
        max-width: none !important;
    }
}

@media (max-width: 576px) {
    .auth-row {
        padding: 12px 0;
    }
    .auth-card {
        border-radius: 18px;
    }
    .auth-card-body {
        padding: 1.5rem !important;
    }
    .auth-submit-btn {
        min-height: 56px;
        font-size: 1rem;
    }
}
</style>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    
    // ✅ AUTO-CLOSE ALERTS APÓS 5 SEGUNDOS
    $('.auto-close-alert').each(function() {
        const alert = $(this);
        
        // Fechar automaticamente após 5 segundos
        setTimeout(function() {
            alert.css('animation', 'fadeOut 0.5s ease-out');
            setTimeout(function() {
                alert.alert('close');
            }, 500);
        }, 5000);
        
        // Pausar auto-close se o mouse estiver sobre o alert
        alert.hover(
            function() {
                // Mouse enter - pausar timer
                const currentTimeout = alert.data('timeout');
                if (currentTimeout) {
                    clearTimeout(currentTimeout);
                }
            },
            function() {
                // Mouse leave - retomar timer
                const alert = $(this);
                const newTimeout = setTimeout(function() {
                    alert.css('animation', 'fadeOut 0.5s ease-out');
                    setTimeout(function() {
                        alert.alert('close');
                    }, 500);
                }, 2000);
                alert.data('timeout', newTimeout);
            }
        );
    });
    
    // ✅ TOGGLE PASSWORD VISIBILITY
    $('#togglePassword').click(function() {
        const passwordField = $('#passwordField');
        const toggleIcon = $('#toggleIcon');
        
        if (passwordField.attr('type') === 'password') {
            passwordField.attr('type', 'text');
            toggleIcon.removeClass('fa-eye').addClass('fa-eye-slash');
        } else {
            passwordField.attr('type', 'password');
            toggleIcon.removeClass('fa-eye-slash').addClass('fa-eye');
        }
    });
    
    // ✅ LOADING STATE NO SUBMIT
    $('#loginForm').submit(function(e) {
        const submitBtn = $(this).find('button[type="submit"]');
        const btnText = submitBtn.find('.btn-text');
        const spinner = submitBtn.find('#loading-spinner');
        
        // Mostrar loading
        submitBtn.addClass('btn-loading');
        submitBtn.prop('disabled', true);
        btnText.html('<i class="fas fa-spinner fa-spin me-2"></i>Entrando...');
        spinner.addClass('d-none');
        
        // Permitir submit normal
        return true;
    });
    
    // ✅ FOCO AUTOMÁTICO NO PRIMEIRO CAMPO
    $('#username').focus();
    
    // ✅ ENTER PARA SUBMIT
    $('.form-control').keypress(function(e) {
        if (e.which === 13) {
            $('#loginForm').submit();
        }
    });
    
    // ✅ VALIDAÇÃO EM TEMPO REAL
    $('#username').on('input', function() {
        const value = $(this).val();
        if (value.length >= 3) {
            $(this).removeClass('is-invalid').addClass('is-valid');
        } else {
            $(this).removeClass('is-valid').addClass('is-invalid');
        }
    });
    
    $('#passwordField').on('input', function() {
        const value = $(this).val();
        if (value.length >= 4) {
            $(this).removeClass('is-invalid').addClass('is-valid');
        } else {
            $(this).removeClass('is-valid').addClass('is-invalid');
        }
    });
    
    // ✅ REMOVER LOADING SE VOLTAR À PÁGINA (erro de login)
    window.addEventListener('pageshow', function() {
        const submitBtn = $('#loginForm').find('button[type="submit"]');
        const btnText = submitBtn.find('.btn-text');
        const spinner = submitBtn.find('#loading-spinner');
        
        submitBtn.removeClass('btn-loading');
        submitBtn.prop('disabled', false);
        btnText.html('<i class="fas fa-sign-in-alt me-2"></i>Entrar');
        spinner.addClass('d-none');
    });
    
});
</script>
{% endblock %}
