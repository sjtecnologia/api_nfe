<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Painel de Administração{% endblock %}</title>
    {# Inclua jQuery e jQuery Mask Plugin AQUI #}
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <style>
        /* Manter as cores SJ Tecnologia */
        :root {
            --sj-teal-dark: #00A29C;
            --sj-teal-medium: #00877F;
            --sj-blue-light: #A1E4FF;
            --sj-gray-dark: #343A40;
            --sj-gray-medium: #6C757D;
            --sj-gray-light: #F8F9FA;
            --sj-gray-border: #CED4DA;
        }

        body { font-family: Arial, sans-serif; margin: 20px; background-color: var(--sj-gray-light); color: var(--sj-gray-dark); }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: var(--sj-teal-dark); }
        .navbar { background-color: var(--sj-teal-dark); padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .navbar a { color: white; text-decoration: none; padding: 8px 15px; display: inline-block; }
        .navbar a:hover { background-color: var(--sj-teal-medium); border-radius: 3px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid var(--sj-gray-border); padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { background-color: var(--sj-teal-dark); color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin-right: 5px; }
        .btn:hover { background-color: var(--sj-teal-medium); }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-warning { background-color: #ffc107; color: var(--sj-gray-dark); }
        .btn-warning:hover { background-color: #e0a800; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="password"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea { width: calc(100% - 18px); padding: 8px; border: 1px solid var(--sj-gray-border); border-radius: 4px; box-sizing: border-box; }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--sj-teal-dark);
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(0, 162, 156, 0.25);
        }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        /* Estilo para o botão de buscar CEP */
        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8em;
        }

        /* Overlay de carregamento para o CEP */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            border: 4px solid var(--sj-teal-dark);
            border-top: 4px solid var(--sj-gray-medium);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="{{ url_for('admin_regimes_tributarios_list') }}">Regimes Tributários</a>
            <a href="{{ url_for('admin_clientes_list') }}">Clientes</a>
            <a href="{{ url_for('admin_certificados_list') }}">Certificados Digitais</a> {# NOVO LINK #}
            {# <a href="{{ url_for('admin_cfops_list') }}">CFOPs</a> #}
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
