{% extends 'base.html' %}

{% block title %}{% if regime %}Editar{% else %}Adicionar{% endif %} Regime Tributário{% endblock %}

{% block content %}
    <h1>{% if regime %}Editar{% else %}Adicionar Novo{% endif %} Regime Tributário</h1>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" value="{{ regime.nome if regime else '' }}" required>
        </div>
        <div class="form-group">
            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao">{{ regime.descricao if regime else '' }}</textarea>
        </div>
        <button type="submit" class="btn">Salvar</button>
        <a href="{{ url_for('admin_regimes_tributarios_list') }}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
