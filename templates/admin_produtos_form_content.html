{# Este template contém apenas o formulário para ser incluído em um modal ou outra parte da página #}
<!-- <form id="produtoModalForm" action="{{ url_for('admin_produtos_add', modal=true) }}" method="post"> -->
    {# Input oculto para o cliente_id #}
    <input type="hidden" name="cliente_id" value="{{ form_data.cliente_id | default(return_client_id) }}">

    <div class="mb-3">
        <label for="cliente_id_select" class="form-label">Cliente Associado</label>
        <select class="form-select" id="cliente_id_select" name="cliente_id_display" disabled> 
            <option value="">Selecione um cliente...</option>
            {% for cliente_item in clientes %}
                <option value="{{ cliente_item.cliente_id }}" {% if (form_data.cliente_id | default(return_client_id)) == cliente_item.cliente_id %}selected{% endif %}>
                    {{ cliente_item.razao_social }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="codigo_interno" class="form-label">Código Interno</label>
        <input type="text" class="form-control" id="codigo_interno" name="codigo_interno" value="{{ form_data.codigo_interno | default('') }}" required>
    </div>
    <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" name="descricao" rows="3" required>{{ form_data.descricao | default('') }}</textarea>
    </div>
    <div class="mb-3">
        <label for="ncm_id" class="form-label">NCM</label>
        <select class="form-select" id="ncm_id" name="ncm_id">
            <option value="">Selecione um NCM...</option>
            {% for ncm_item in ncms %}
                <option value="{{ ncm_item.ncm_id }}" {% if form_data.ncm_id == ncm_item.ncm_id %}selected{% endif %}>
                    {{ ncm_item.codigo }} - {{ ncm_item.descricao | truncate(50, True, '...') }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="cest" class="form-label">CEST</label>
        <input type="text" class="form-control" id="cest" name="cest" value="{{ form_data.cest | default('') }}">
    </div>
    <div class="mb-3">
        <label for="unidade_comercial" class="form-label">Unidade Comercial</label>
        <input type="text" class="form-control" id="unidade_comercial" name="unidade_comercial" value="{{ form_data.unidade_comercial | default('') }}" required>
    </div>
    <div class="mb-3">
        <label for="preco_unitario_padrao" class="form-label">Preço Unitário Padrão</label>
        <input type="number" step="0.01" class="form-control" id="preco_unitario_padrao" name="preco_unitario_padrao" value="{{ form_data.preco_unitario_padrao | default('0.00') }}" required>
    </div>
    <div class="mb-3">
        <label for="origem_mercadoria" class="form-label">Origem da Mercadoria</label>
        <select class="form-select" id="origem_mercadoria" name="origem_mercadoria" required>
            <option value="">Selecione a origem...</option>
            {% for origem_item in origens %}
                <option value="{{ origem_item.origem_id }}" {% if form_data.origem_mercadoria == origem_item.origem_id %}selected{% endif %}>
                    {{ origem_item.codigo }} - {{ origem_item.descricao }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="tipo_item" class="form-label">Tipo de Item</label>
        <input type="text" class="form-control" id="tipo_item" name="tipo_item" value="{{ form_data.tipo_item | default('') }}" required>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="ativo" name="ativo" {% if form_data.ativo | default(true) %}checked{% endif %}>
        <label class="form-check-label" for="ativo">
            Produto Ativo
        </label>
    </div>

    <!-- <button type="submit" class="btn btn-success">Salvar Produto</button>
</form> -->
