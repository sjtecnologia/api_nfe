<!DOCTYPE html>
<html>
<head>
    <title>Erro - EmiteMax</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .error-box {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            padding: 20px;
            color: #721c24;
        }
        h1 { color: #721c24; }
        .back-link {
            margin-top: 20px;
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>Internal Server Error</h1>
        <p>Ocorreu um erro interno no servidor. Por favor, tente novamente mais tarde.</p>
        {% if error %}
        <p><strong>Detalhes:</strong> {{ error }}</p>
        {% endif %}
    </div>
    <a href="{{ url_for('home.home') }}" class="back-link">← Voltar para o Início</a>
</body>
</html>
