{% extends "base.html" %}

{% block title %}Redefinir Senha - EmiteMax{% endblock %}

{% block content %}
<div class="container-fluid auth-shell">
    <div class="row justify-content-center align-items-center auth-row">
        <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-12">
            
            <!-- Card de Redefinição de Senha -->
            <div class="card shadow-lg border-0 auth-card">
                
                <!-- Header -->
                <div class="card-header text-center py-4 auth-card-header" style="border: none;">
                    <div class="logo-container mb-3">
                        <img src="{{ url_for('static', filename='img/emitemax-logo.png') }}" 
                             alt="EmiteMax" 
                             style="width: 120px; height: auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                    </div>
                    <h2 class="text-white mb-1" style="font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                        <i class="fas fa-lock me-2"></i>Nova Senha
                    </h2>
                    <p class="text-white mb-0" style="opacity: 0.9; font-size: 0.95rem;">
                        Digite sua nova senha
                    </p>
                </div>
                
                <!-- Corpo do Formulário -->
                <div class="card-body p-5 auth-card-body">
                    
                    <form method="POST" id="resetPasswordForm">
                        
                        <!-- Campo Nova Senha -->
                        <div class="form-group mb-4">
                            <label for="password" class="form-label text-dark font-weight-600">
                                <i class="fas fa-lock text-primary me-2"></i>
                                Nova Senha
                            </label>
                            <div class="input-group">
                                    <input type="password" class="form-control form-control-lg auth-input auth-input-group-left" id="password" name="password"
                                       placeholder="Digite a nova senha" required minlength="6">
                                <div class="input-group-append">
                                    <button class="btn btn-outline-secondary auth-input-group-right" type="button" id="togglePassword1">
                                        <i class="fas fa-eye" id="toggleIcon1"></i>
                                    </button>
                                </div>
                            </div>
                            <small class="form-text text-muted mt-2">
                                <i class="fas fa-info-circle"></i>
                                Mínimo de 6 caracteres
                            </small>
                        </div>
                        
                        <!-- Campo Confirmar Senha -->
                        <div class="form-group mb-4">
                            <label for="confirm_password" class="form-label text-dark font-weight-600">
                                <i class="fas fa-lock text-primary me-2"></i>
                                Confirmar Senha
                            </label>
                            <div class="input-group">
                                    <input type="password" class="form-control form-control-lg auth-input auth-input-group-left" id="confirm_password" name="confirm_password"
                                       placeholder="Confirme a nova senha" required minlength="6">
                                <div class="input-group-append">
                                    <button class="btn btn-outline-secondary auth-input-group-right" type="button" id="togglePassword2">
                                        <i class="fas fa-eye" id="toggleIcon2"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Indicador de Força da Senha -->
                        <div class="mb-4">
                            <div class="progress" style="height: 5px; border-radius: 10px;">
                                <div id="passwordStrength" class="progress-bar" role="progressbar" style="width: 0%; transition: all 0.3s ease;"></div>
                            </div>
                            <small id="strengthText" class="text-muted"></small>
                        </div>
                        
                        <!-- Botão de Submit -->
                        <div class="form-group mb-4 d-grid">
                            <button type="submit" class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center auth-submit-btn" id="submitBtn">
                                <span class="btn-text">
                                    <i class="fas fa-check me-2"></i>Redefinir Senha
                                </span>
                                <i class="fas fa-spinner fa-spin d-none" id="loading-spinner"></i>
                            </button>
                        </div>
                        
                        <!-- Link para Voltar -->
                        <div class="text-center">
                            <a href="{{ url_for('auth.login') }}" class="text-muted" style="font-size: 0.9rem; text-decoration: none;">
                                <i class="fas fa-arrow-left"></i>
                                Voltar ao login
                            </a>
                        </div>
                        
                    </form>
                </div>
                
                <!-- Footer -->
                <div class="card-footer text-center py-3 auth-card-footer" style="border: none;">
                    <p class="text-muted mb-0" style="font-size: 0.85rem;">
                        <i class="fas fa-shield-alt text-primary"></i>
                        Sistema Seguro EmiteMax &copy; 2025
                    </p>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
// Toggle password visibility
document.getElementById('togglePassword1').addEventListener('click', function() {
    const passwordField = document.getElementById('password');
    const icon = document.getElementById('toggleIcon1');
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        passwordField.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
});

document.getElementById('togglePassword2').addEventListener('click', function() {
    const passwordField = document.getElementById('confirm_password');
    const icon = document.getElementById('toggleIcon2');
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        passwordField.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
});

// Password strength indicator
document.getElementById('password').addEventListener('input', function() {
    const password = this.value;
    const strengthBar = document.getElementById('passwordStrength');
    const strengthText = document.getElementById('strengthText');
    
    let strength = 0;
    let text = '';
    let color = '';
    
    if (password.length >= 6) strength += 25;
    if (password.length >= 8) strength += 25;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
    if (/\d/.test(password)) strength += 25;
    
    if (strength <= 25) {
        text = 'Fraca';
        color = 'bg-danger';
    } else if (strength <= 50) {
        text = 'Média';
        color = 'bg-warning';
    } else if (strength <= 75) {
        text = 'Boa';
        color = 'bg-info';
    } else {
        text = 'Forte';
        color = 'bg-success';
    }
    
    strengthBar.style.width = strength + '%';
    strengthBar.className = 'progress-bar ' + color;
    strengthText.textContent = text;
});

// Form validation
document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        e.preventDefault();
        alert('As senhas não coincidem!');
        return false;
    }
    
    if (password.length < 6) {
        e.preventDefault();
        alert('A senha deve ter no mínimo 6 caracteres!');
        return false;
    }
    
    const btn = this.querySelector('button[type="submit"]');
    const btnText = btn.querySelector('.btn-text');
    const spinner = btn.querySelector('#loading-spinner');
    
    btnText.classList.add('d-none');
    spinner.classList.remove('d-none');
    btn.disabled = true;
});
</script>

<style>
.auth-shell {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(34, 162, 201, 0.20), transparent 30%),
        radial-gradient(circle at bottom right, rgba(15, 76, 129, 0.18), transparent 28%),
        linear-gradient(135deg, #eef4f8 0%, #d9e7f2 48%, #edf3f8 100%);
}

.auth-row {
    min-height: 100vh;
    padding: 32px 0;
}

.auth-card {
    border-radius: 24px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
    animation: authRise 0.6s ease-out;
}

.auth-card-header {
    background: linear-gradient(135deg, #0f4c81 0%, #0b6aa8 56%, #22a2c9 100%);
}

.auth-card-body {
    padding: 2.5rem !important;
}

.auth-card-footer {
    background: linear-gradient(180deg, #f8fbfd 0%, #ffffff 100%);
}

.auth-input {
    border: 2px solid #d9e2ec;
    padding: 16px 18px;
    font-size: 1rem;
    transition: all 0.25s ease;
}

.auth-input-group-left {
    border-radius: 14px 0 0 14px;
    border-right: none;
}

.auth-input-group-right {
    border-radius: 0 14px 14px 0;
    border: 2px solid #d9e2ec;
    border-left: none;
    padding: 15px 16px;
}

.auth-input:focus {
    border-color: #22a2c9;
    box-shadow: 0 0 0 0.2rem rgba(34, 162, 201, 0.20);
    transform: translateY(-1px);
}

.auth-submit-btn {
    border-radius: 14px;
    min-height: 60px;
    padding: 16px 22px;
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    box-shadow: 0 8px 24px rgba(34, 162, 201, 0.28);
    transition: all 0.25s ease;
}

.auth-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(34, 162, 201, 0.36);
}

@keyframes authRise {
    from {
        opacity: 0;
        transform: translateY(24px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    .auth-row {
        padding: 20px 0;
    }

    .auth-card-body {
        padding: 2rem !important;
    }
}

@media (max-width: 576px) {
    .auth-row {
        padding: 12px 0;
    }

    .auth-card {
        border-radius: 18px;
    }

    .auth-card-body {
        padding: 1.5rem !important;
    }

    .auth-submit-btn {
        min-height: 56px;
        font-size: 1rem;
    }
}
</style>
{% endblock %}
