{% extends "base.html" %}
{% block title %}500 — Erro interno{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-bold text-danger">500</h1>
            <h2 class="mb-3">Erro interno do servidor</h2>
            <p class="text-muted mb-4">
                Algo deu errado no servidor. Nossa equipe foi notificada.<br>
                Por favor, tente novamente em alguns instantes.
            </p>
            <a href="/" class="btn btn-primary me-2">
                <i class="fas fa-home me-2"></i>Voltar ao início
            </a>
            <a href="javascript:location.reload()" class="btn btn-outline-secondary">
                <i class="fas fa-sync me-2"></i>Tentar novamente
            </a>
        </div>
    </div>
</div>
{% endblock %}
