{% extends "base.html" %}
{% block title %}404 — Página não encontrada{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-bold text-muted">404</h1>
            <h2 class="mb-3">Página não encontrada</h2>
            <p class="text-muted mb-4">
                O recurso que você procura não existe ou foi removido.
            </p>
            <a href="{{ url_for('home.index') if 'home' in app.blueprints else '/' }}" class="btn btn-primary">
                <i class="fas fa-home me-2"></i>Voltar ao início
            </a>
        </div>
    </div>
</div>
{% endblock %}
